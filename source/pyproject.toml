[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgate-dsp"
version = "0.1.0"
description = "Explicit, causal DSP primitives for the FlowGate research rehabilitation"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.0", "scipy==1.18.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "scikit-learn==1.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
